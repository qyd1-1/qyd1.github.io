<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>数据表格页面</title>
    <style>
        body {
            padding: 40px;
            font-family: "Microsoft Yahei";
            background-color: #f0f2f5;
        }
        h2 {
            margin-bottom: 20px;
            color: #333;
        }
        table {
            border-collapse: collapse;
            width: 700px;
            background: #fff;
            box-shadow: 0 0 8px #ddd;
        }
        th,td {
            border: 1px solid #ccc;
            padding: 12px;
            text-align: center;
        }
        th {
            background-color: #007bff;
            color: white;
        }
        a {
            display: inline-block;
            margin-top: 20px;
            color: #007bff;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <h2>用户信息表</h2>
    <table>
        <tr>
            <th>编号</th>
            <th>姓名</th>
            <th>年龄</th>
            <th>城市</th>
        </tr>
        <tr>
            <td>1</td>
            <td>张三</td>
            <td>20</td>
            <td>成都</td>
        </tr>
        <tr>
            <td>2</td>
            <td>李四</td>
            <td>22</td>
            <td>重庆</td>
        </tr>
        <tr>
            <td>3</td>
            <td>王五</td>
            <td>19</td>
            <td>绵阳</td>
        </tr>
    </table>
    <br>
    <a href="login.html">返回登录页</a>
</body>
</html>
